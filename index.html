<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lemonade Tycoon</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #fffdf2; text-align: center; padding: 20px; user-select: none; }
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .val { font-weight: bold; color: #f1c40f; display: block; font-size: 1.2em; }
        button { 
            width: 100%; padding: 20px; margin: 10px 0; border: none; border-radius: 15px; 
            font-size: 18px; font-weight: bold; cursor: pointer; background: #ffe066;
            touch-action: manipulation; /* Убирает задержку клика на смартфонах */
        }
        .btn-make { background: #2ecc71; color: white; margin-top: 20px; }
        button:active { background: #ddd; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍋 Лимонадная Лавка</h2>
        <div class="stat-grid">
            <div>💰 Деньги<span id="money" class="val">50</span></div>
            <div>🌟 Уровень<span id="lvl" class="val">1</span></div>
            <div>🍋 Лимоны<span id="lemons" class="val">0</span></div>
            <div>🍬 Сахар<span id="sugar" class="val">0</span></div>
        </div>
    </div>

    <button onclick="buy('lemon')">Купить Лимон (10₽)</button>
    <button onclick="buy('sugar')">Купить Сахар 100г (5₽)</button>
    <button class="btn-make" onclick="make()">⚡ СВАРИТЬ ЛИМОНАД</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Начальные данные (на случай если облако не ответит)
        let state = { money: 50, lemons: 0, sugar: 0, lvl: 1, total_made: 0, successful: 0 };

        // Функция обновления экрана
        function updateUI() {
            document.getElementById('money').innerText = state.money + '₽';
            document.getElementById('lemons').innerText = state.lemons;
            document.getElementById('sugar').innerText = state.sugar;
            document.getElementById('lvl').innerText = state.lvl;
        }

        // Попытка загрузки из Облака
        try {
            tg.CloudStorage.getItem('lemon_save', (err, value) => {
                if (!err && value) {
                    state = JSON.parse(value);
                    updateUI();
                }
            });
        } catch(e) { console.log("CloudStorage недоступен"); }

        function save() {
            updateUI();
            try {
                tg.CloudStorage.setItem('lemon_save', JSON.stringify(state));
            } catch(e) {}
        }

        function buy(type) {
            if (type === 'lemon' && state.money >= 10) {
                state.money -= 10; state.lemons += 1;
            } else if (type === 'sugar' && state.money >= 5) {
                state.money -= 5; state.sugar += 100;
            } else {
                alert("Недостаточно денег!");
                return;
            }
            save();
        }

        function make() {
            if (state.lemons >= 1 && state.sugar >= 100) {
                state.lemons -= 1;
                state.sugar -= 100;
                state.total_made += 1;

                let price = 30 + (state.lvl * 5);
                
                // Шанс порчи 15% со второго раза
                if (state.total_made > 1 && Math.random() < 0.15) {
                    let earned = Math.floor(price * 0.3);
                    state.money += earned;
                    alert("🤢 Испортился! Выручка: " + earned + "₽");
                } else {
                    state.money += price;
                    state.successful += 1;
                    state.lvl = Math.floor(state.successful / 5) + 1;
                }
                save();
            } else {
                alert("Нужно: 1 лимон и 100г сахара!");
            }
        }

        updateUI();
    </script>
</body>
</html>
