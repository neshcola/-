<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lemonade Tycoon Universal</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --accent: #f1c40f; --success: #2ecc71; --blue: #3498db; --bg: #fffdf2; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; user-select: none; color: #333; }
        
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .val { font-size: 1.2em; font-weight: bold; color: var(--accent); }
        .label { font-size: 11px; color: #999; text-transform: uppercase; }
        
        /* Инвентарь под статистикой */
        .inventory { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
        .badge { background: #f0f0f0; padding: 4px 8px; border-radius: 8px; color: #444; border: 1px solid #ddd; animation: fadeIn 0.3s; }

        .nav { display: flex; gap: 8px; margin-bottom: 15px; }
        .nav button { flex: 1; padding: 12px; border-radius: 12px; border: none; background: #eee; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav button.active { background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(241,196,15,0.3); }

        .view { display: none; }
        .active-view { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .buy { background: #fff; border: 1px solid #eee; }
        .make { background: var(--success); color: white; }
        .sell { background: var(--blue); color: white; }
        
        #lemon-pic { font-size: 60px; text-align: center; margin: 10px 0; transition: 0.2s; }
        .bump { transform: scale(1.3); }
    </style>
</head>
<body>

    <div class="card">
        <div class="grid">
            <div><span class="label">💰 Деньги</span><div id="m-money" class="val">50₽</div></div>
            <div><span class="label">🌟 Уровень</span><div id="m-lvl" class="val">1</div></div>
            <div><span class="label">🍋 Лимоны</span><div id="m-lem" class="val">0</div></div>
            <div><span class="label">🍬 Сахар</span><div id="m-sug" class="val">0г</div></div>
            <div style="grid-column: span 2; padding-top: 5px;">
                <span class="label">🥤 На складе: </span><b id="m-bottles" style="color:var(--blue)">0</b>
            </div>
        </div>
        <!-- Инвентарь купленных вещей -->
        <div id="inv-list" class="inventory">
            <span class="badge">Инвентарь пуст</span>
        </div>
    </div>

    <div class="nav">
        <button id="tab-g" class="active" onclick="switchTab('game')">🏠 Кухня</button>
        <button id="tab-s" onclick="switchTab('shop')">🛒 Магазин</button>
    </div>

    <div id="v-game" class="active-view">
        <div id="lemon-pic">🍋</div>
        <button class="btn buy" onclick="handleAction('buy_lemon')">🍋 Купить Лимон (10₽)</button>
        <button class="btn buy" onclick="handleAction('buy_sugar')">🍬 Купить Сахар (5₽)</button>
        <button class="btn make" onclick="handleAction('make')">⚡ СВАРИТЬ ЛИМОНАД</button>
        <button class="btn sell" onclick="handleAction('sell')">💰 ПРОДАТЬ</button>
    </div>

    <div id="v-shop" class="view">
        <div class="card">
            <p><b>❄️ Холодильник</b><br><small>Порча -5%</small><br>
            <button class="btn buy" onclick="handleAction('upg_fridge')">Купить за <span id="u-f">200</span>₽</button></p>
            <hr style="border:0; border-top:1px solid #eee">
            <p><b>🥤 Соковыжималка</b><br><small>Доход +10₽</small><br>
            <button class="btn buy" onclick="handleAction('upg_juicer')">Купить за <span id="u-j">350</span>₽</button></p>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp с проверкой на браузер
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Базовое состояние игры
        let s = { money: 50, lemons: 0, sugar: 0, lvl: 1, bottles: 0, totalSold: 0, successful: 0, fridge: 0, juicer: 0 };

        function updateUI() {
            document.getElementById('m-money').innerText = Math.floor(s.money) + '₽';
            document.getElementById('m-lem').innerText = s.lemons;
            document.getElementById('m-sug').innerText = s.sugar + 'г';
            document.getElementById('m-lvl').innerText = s.lvl;
            document.getElementById('m-bottles').innerText = s.bottles + ' шт.';
            
            document.getElementById('u-f').innerText = (s.fridge + 1) * 200;
            document.getElementById('u-j').innerText = (s.juicer + 1) * 350;

            let invHtml = "";
            if (s.fridge > 0) invHtml += `<span class="badge">❄️ Холод x${s.fridge}</span>`;
            if (s.juicer > 0) invHtml += `<span class="badge">🥤 Сок x${s.juicer}</span>`;
            document.getElementById('inv-list').innerHTML = invHtml || '<span class="badge">Инвентарь пуст</span>';

            // Сохранение в память браузера (работает везде)
            localStorage.setItem('lemon_tycoon_universal', JSON.stringify(s));
            
            // Сохранение в облако Telegram (только если в ТГ)
            if (tg && tg.CloudStorage) {
                try { tg.CloudStorage.setItem('lemon_tycoon_universal', JSON.stringify(s)); } catch(e) {}
            }
        }

        function switchTab(t) {
            document.getElementById('v-game').className = (t === 'game' ? 'active-view' : 'view');
            document.getElementById('v-shop').className = (t === 'shop' ? 'active-view' : 'view');
            document.getElementById('tab-g').className = (t === 'game' ? 'active' : '');
            document.getElementById('tab-s').className = (t === 'shop' ? 'active' : '');
        }

        function handleAction(action) {
            if (action === 'buy_lemon') {
                if (s.money >= 10) { s.money -= 10; s.lemons++; } else alert("Мало денег!");
            } 
            else if (action === 'buy_sugar') {
                if (s.money >= 5) { s.money -= 5; s.sugar += 100; } else alert("Мало денег!");
            }
            else if (action === 'make') {
                if (s.lemons >= 1 && s.sugar >= 100) {
                    s.lemons--; s.sugar -= 100; s.bottles++;
                    const pic = document.getElementById('lemon-pic');
                    pic.className = 'bump'; setTimeout(() => pic.className = '', 200);
                } else alert("Нужно: 1 лимон и 100г сахара!");
            }
            else if (action === 'sell') {
                if (s.bottles < 1) { alert("Склад пуст!"); return; }
                s.bottles--; s.totalSold++;
                let price = 30 + (s.lvl * 5) + (s.juicer * 10);
                let risk = 0.15 - (s.fridge * 0.05);

                if (s.totalSold > 1 && Math.random() < Math.max(0.01, risk)) {
                    let earned = Math.floor(price * 0.3);
                    s.money += earned;
                    alert("🤮 Покупатель недоволен! Получено: " + earned + "₽");
                } else {
                    s.money += price; s.successful++;
                    s.lvl = Math.floor(s.successful / 5) + 1;
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }
            }
            else if (action.startsWith('upg')) {
                let type = action.split('_')[1];
                let cost = (type === 'fridge' ? (s.fridge + 1) * 200 : (s.juicer + 1) * 350);
                if (s.money >= cost) {
                    s.money -= cost;
                    s[type]++;
                } else alert("Не хватает денег!");
            }
            updateUI();
        }

        // Загрузка сохраненных данных
        const localData = localStorage.getItem('lemon_tycoon_universal');
        if (localData) {
            s = JSON.parse(localData);
        }

        updateUI();
    </script>
</body>
</html>
